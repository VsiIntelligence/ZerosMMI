name: Unzip and Commit Files

on:
  push:
    paths:
      - '**.zip' # Triggers only when a .zip file is pushed
  workflow_dispatch: # Allows you to run the workflow manually

jobs:
  unzip-and-push:
    runs-on: ubuntu-latest
    
    # Grants write permissions to push code back to the repository
    permissions:
      contents: write

    steps:
      # 1. Check out the repository contents
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract the ZIP file
      # Change 'archive.zip' to match your specific zip filename or path
      - name: Extract zip file
        run: |
          ZIP_FILE="zerosvsistudio--main.zip"
          
          if [ -f "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE..."
            # Unzips into the current directory, overwriting existing files (-o)
            unzip -o "$ZIP_FILE"
          else
            echo "Error: $ZIP_FILE not found."
            exit 1
          fi

      # 3. Commit and push the extracted files back to GitHub
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Only commit if there are changes to avoid workflow errors
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated unzip of $ZIP_FILE"
          git push
